[tools]
node = "22"

[tasks.run]
description = "Sobe a aplicação em modo de desenvolvimento"
run = "npm run dev"

[tasks.build]
description = "Compila o servidor e o JS de cliente"
run = "npm run build"

[tasks.test]
description = "Roda os testes"
run = "npm test"

[tasks.lint]
description = "Verifica tipos, estilo e regras de camada"
run = "npm run typecheck && npm run lint"

[tasks.format]
description = "Corrige o estilo do código (Biome)"
run = "npm run format"

[tasks.check]
description = "Tudo: tipos, lint e testes"
run = "npm run check"

[tasks.migrate]
description = "Aplica as migrations no banco"
run = "npm run db:deploy"

[tasks.seed]
description = "Popula o banco com dados de exemplo"
run = "npm run db:seed"

[tasks.start]
description = "Roda o build de produção"
run = "npm start"

[tasks."test:watch"]
description = "Testes em modo watch"
run = "npm run test:watch"

[tasks.typecheck]
description = "Só a verificação de tipos"
run = "npm run typecheck"

[tasks."db:new-migration"]
description = "Cria e aplica uma migration nova (desenvolvimento)"
run = "npm run db:migrate"

[tasks."db:generate"]
description = "Regenera o client do Prisma"
run = "npm run db:generate"

[tasks."db:studio"]
description = "Abre a GUI de inspeção do banco"
run = "npm run db:studio"
