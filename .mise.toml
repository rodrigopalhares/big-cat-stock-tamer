[tools]
node = "22"

[tasks.run]
description = "Sobe a aplicação em modo de desenvolvimento"
run = "npm run dev"

[tasks.build]
description = "Compila o servidor e o JS de cliente"
run = "npm run build"

[tasks.test]
description = "Roda os testes"
run = "npm test"

[tasks.lint]
description = "Verifica tipos, estilo e regras de camada"
run = "npm run typecheck && npm run lint"

[tasks.format]
description = "Corrige o estilo do código (Biome)"
run = "npm run format"

[tasks.check]
description = "Tudo: tipos, lint e testes"
run = "npm run check"

[tasks.migrate]
description = "Aplica as migrations no banco"
run = "npm run db:deploy"

[tasks.seed]
description = "Popula o banco com dados de exemplo"
run = "npm run db:seed"
